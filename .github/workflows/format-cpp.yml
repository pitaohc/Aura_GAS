name: Format C++ on PR

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  format:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/format'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get changed C++ files
        id: changed-files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # 对于评论触发，获取 PR 的所有变更文件
            PR_NUMBER=$(gh pr view ${{ github.event.issue.number }} --json number -q number)
            FILES=$(gh pr diff $PR_NUMBER --name-only | grep -E '\.(h|cpp|hpp|inl|c|cc)$' || true)
          else
            # 对于 PR 事件，获取 PR 中变更的文件
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(h|cpp|hpp|inl|c|cc)$' || true)
          fi
          
          if [ -z "$FILES" ]; then
            echo "has_cpp_files=false" >> $GITHUB_OUTPUT
          else
            echo "has_cpp_files=true" >> $GITHUB_OUTPUT
            echo "$FILES" > /tmp/changed_files.txt
            echo "Changed C++ files:"
            cat /tmp/changed_files.txt
          fi

      - name: Install clang-format
        if: steps.changed-files.outputs.has_cpp_files == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting (PR event)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_cpp_files == 'true'
        run: |
          echo "Checking formatting..."
          FAILED=false
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
                FAILED=true
                echo "::error file=$file::Format check failed: $file"
                echo "Expected format:"
                clang-format "$file" | head -20
                echo "..."
              fi
            fi
          done < /tmp/changed_files.txt
          
          if [ "$FAILED" = true ]; then
            echo ""
            echo "::error::Format check failed. Please run 'clang-format -i' on the files above, or use /format command."
            exit 1
          fi
          
          echo "Format check passed."

      - name: Format and commit (comment event)
        if: github.event_name == 'issue_comment' && steps.changed-files.outputs.has_cpp_files == 'true'
        run: |
          echo "Formatting C++ files..."
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              clang-format -i "$file"
              echo "Formatted: $file"
            fi
          done < /tmp/changed_files.txt

      - name: Check for changes and commit
        if: github.event_name == 'issue_comment'
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
          else
            echo "Formatting changes detected:"
            git diff --stat
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add -A
            git commit -m "style: auto-format C++ files"
            git push
            echo "Format commit pushed successfully."
          fi